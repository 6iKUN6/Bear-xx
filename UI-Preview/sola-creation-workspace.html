<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sola · 创作工作区交互原型</title>
    <!-- 独立评审原型；沿用现有 Sola Desktop 的侧栏、S 标识与对话语言。
       主题：@litter-bear/theme warm-workbench 浅/深色；--lb-* 与主题包真实映射对齐。
       全部模型、创作内容与生成过程均为本地演示；无远程请求，不代表真实模型能力。
       HTML/CSS/JS 全部内联，可 file:// 打开；数据仅存于此原型的 localStorage。 -->
    <style>
      :root {
        color-scheme: light;
        --lb-page-background: #f2f3f5;
        --lb-surface: #fff;
        --lb-surface-strong: #fff;
        --lb-surface-muted: #f8f6f3;
        --lb-surface-hover: #f0ece7;
        --lb-text-primary: #29231f;
        --lb-text-secondary: #6d655e;
        --lb-text-muted: #918981;
        --lb-line-soft: #e8e3de;
        --lb-line-strong: #c7beb5;
        --lb-accent: #b65f16;
        --lb-accent-strong: #93490f;
        --lb-accent-soft: #f7e5d2;
        --lb-accent-ink: #71370c;
        --lb-accent-surface: #b65f16;
        --lb-on-accent: #fff;
        --lb-success: #347747;
        --lb-success-soft: #e6f3e8;
        --lb-info: #3f6f9f;
        --lb-info-soft: #eaf1f8;
        --lb-warning: #ad7812;
        --lb-warning-soft: #fbf1d7;
        --lb-danger: #c23d35;
        --lb-danger-soft: #fbe9e7;
        --lb-radius-xs: 4px;
        --lb-radius-sm: 6px;
        --lb-radius-md: 8px;
        --lb-shadow-card: 0 4px 14px rgba(58, 45, 35, 0.055);
        --lb-shadow-glow: 0 12px 28px rgba(125, 73, 27, 0.16);
        --font-ui:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        --font-book: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
        --sidebar: 224px;
        --outline: 180px;
        --assistant: 324px;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --lb-page-background: #1c1815;
        --lb-surface: #262019;
        --lb-surface-strong: #2e2720;
        --lb-surface-muted: #221c17;
        --lb-surface-hover: #38302a;
        --lb-text-primary: #f0e9e2;
        --lb-text-secondary: #b9aca0;
        --lb-text-muted: #8a7d70;
        --lb-line-soft: #3d332a;
        --lb-line-strong: #5a4c3e;
        --lb-accent: #e0915a;
        --lb-accent-strong: #c97a3f;
        --lb-accent-soft: #3d2c1c;
        --lb-accent-ink: #f5c99a;
        --lb-accent-surface: #e0915a;
        --lb-on-accent: #241a10;
        --lb-success: #6fb483;
        --lb-success-soft: #223324;
        --lb-info: #7aa6cf;
        --lb-info-soft: #22303c;
        --lb-warning: #d3a54a;
        --lb-warning-soft: #3a2f16;
        --lb-danger: #e07b71;
        --lb-danger-soft: #3d2320;
        --lb-shadow-card: 0 4px 14px rgba(0, 0, 0, 0.3);
        --lb-shadow-glow: 0 12px 28px rgba(0, 0, 0, 0.4);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-ui);
        font-size: 13px;
        line-height: 1.6;
        color: var(--lb-text-primary);
        background: var(--lb-page-background);
        overflow: hidden;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: none;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      input,
      textarea,
      select {
        accent-color: var(--lb-accent);
      }
      button,
      input,
      textarea,
      select,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--lb-accent);
        outline-offset: 3px;
      }
      button {
        transition:
          background 0.15s,
          color 0.15s,
          opacity 0.15s;
      }
      button:not(:disabled):hover {
        background: var(--lb-surface-hover);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      svg.i {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .symbols {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      .muted {
        color: var(--lb-text-secondary);
      }
      .small {
        font-size: 11px;
      }
      .serif {
        font-family: var(--font-book);
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 36px;
        padding: 7px 12px;
        border: 1px solid var(--lb-line-soft);
        border-radius: var(--lb-radius-sm);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--lb-accent-surface);
        border-color: transparent;
        color: var(--lb-on-accent);
      }
      .btn.primary:hover {
        background: var(--lb-accent-strong);
      }
      .btn.quiet {
        border-color: transparent;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        flex: none;
        color: var(--lb-text-secondary);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--lb-line-soft);
        border-radius: 5px;
        padding: 2px 7px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--lb-text-secondary);
      }
      .dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--lb-success);
        flex: none;
      }
      .brand-tile {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 7px;
        background: var(--lb-accent-surface);
        color: var(--lb-on-accent);
        font-size: 20px;
        font-weight: 650;
        flex: none;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 1.6px;
        color: var(--lb-text-secondary);
        font-weight: 500;
      }
      .divider {
        height: 1px;
        background: var(--lb-line-soft);
      }
      .titlebar {
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
        border-bottom: 1px solid var(--lb-line-soft);
        background: var(--lb-surface-muted);
        user-select: none;
      }
      .traffic {
        display: flex;
        gap: 7px;
        width: 75px;
      }
      .traffic span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1px solid var(--lb-line-strong);
        background: var(--lb-surface-hover);
      }
      .window-title {
        font-size: 11px;
        font-weight: 500;
        color: var(--lb-text-secondary);
      }
      .prototype-label {
        font-size: 10px;
        color: var(--lb-text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .prototype-label .dot {
        background: var(--lb-accent);
      }
      .app {
        display: flex;
        height: calc(100dvh - 35px);
        min-height: 0;
      }
      .sidebar {
        width: var(--sidebar);
        flex: none;
        background: var(--lb-surface-muted);
        border-right: 1px solid var(--lb-line-soft);
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      .brand {
        padding: 24px 18px 22px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand strong {
        font-size: 17px;
        font-weight: 650;
      }
      .brand .icon-btn {
        margin-left: auto;
      }
      .main-nav {
        padding: 0 10px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        text-align: left;
        font-size: 13px;
        min-height: 40px;
        color: var(--lb-text-secondary);
        margin: 2px 0;
      }
      .nav-item.active {
        background: var(--lb-surface-hover);
        color: var(--lb-text-primary);
        font-weight: 600;
      }
      .nav-item.active > .i {
        color: var(--lb-accent);
      }
      .nav-item .count {
        margin-left: auto;
        font-size: 11px;
        color: var(--lb-text-secondary);
      }
      .side-section {
        padding: 26px 10px 0;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 12px 7px;
        font-size: 11px;
        color: var(--lb-text-secondary);
      }
      .section-heading .icon-btn {
        width: 23px;
        height: 23px;
      }
      .project-link {
        font-size: 12px;
        min-height: 37px;
      }
      .project-link .i {
        width: 15px;
        height: 15px;
      }
      .project-link.active {
        font-weight: 500;
      }
      .history-link {
        padding: 8px 12px;
        font-size: 12px;
        color: var(--lb-text-secondary);
        width: 100%;
        text-align: left;
        border-radius: 6px;
      }
      .side-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .side-bottom {
        padding: 12px;
        border-top: 1px solid var(--lb-line-soft);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--lb-accent-soft);
        color: var(--lb-accent-ink);
        font-size: 12px;
        display: grid;
        place-items: center;
      }
      .account {
        flex: 1;
      }
      .account strong {
        display: block;
        font-size: 12px;
        font-weight: 500;
      }
      .account span {
        font-size: 10px;
        color: var(--lb-text-secondary);
      }
      .main {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--lb-surface);
      }
      .topbar {
        height: 60px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 25px;
        border-bottom: 1px solid var(--lb-line-soft);
      }
      .breadcrumbs {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
        flex: 1;
      }
      .breadcrumbs button {
        color: var(--lb-text-secondary);
        padding: 4px;
        border-radius: 4px;
        font-size: 12px;
      }
      .breadcrumbs > .i {
        width: 12px;
        height: 12px;
        color: var(--lb-text-muted);
      }
      .breadcrumbs strong {
        font-weight: 550;
        font-size: 13px;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .save-state {
        font-size: 10px;
        color: var(--lb-text-secondary);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .save-state .i {
        width: 13px;
        height: 13px;
      }
      .tabs {
        height: 46px;
        display: flex;
        align-items: stretch;
        gap: 25px;
        padding: 0 28px;
        border-bottom: 1px solid var(--lb-line-soft);
        flex: none;
        overflow-x: auto;
      }
      .tab {
        position: relative;
        padding: 0 2px;
        color: var(--lb-text-secondary);
        white-space: nowrap;
        font-size: 12px;
      }
      .tab.active {
        color: var(--lb-accent);
        font-weight: 600;
      }
      .tab.active:after {
        content: "";
        height: 2px;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--lb-accent);
        border-radius: 2px;
      }
      .tab:hover {
        background: none !important;
        color: var(--lb-accent);
      }
      .tab .step-no {
        display: inline-block;
        margin-right: 7px;
        font-size: 10px;
        opacity: 0.7;
      }
      .mobile-menu {
        display: none;
      }
      .workspace {
        min-height: 0;
        flex: 1;
        display: grid;
        grid-template-columns: var(--outline) minmax(0, 1fr) var(--assistant);
      }
      .workspace.assistant-hidden {
        grid-template-columns: var(--outline) minmax(0, 1fr);
      }
      .workspace.assistant-hidden > .assistant {
        display: none;
      }
      .outline {
        border-right: 1px solid var(--lb-line-soft);
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 20px 10px 14px;
        background: var(--lb-surface);
      }
      .outline-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 7px 13px;
        font-size: 12px;
        font-weight: 600;
      }
      .outline-title .icon-btn {
        width: 26px;
        height: 26px;
      }
      .volume {
        font-size: 10px;
        color: var(--lb-text-secondary);
        padding: 3px 7px 13px;
      }
      .chapter-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
        overflow: auto;
      }
      .chapter-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 8px;
        border-radius: 6px;
        width: 100%;
        text-align: left;
      }
      .chapter-item.active {
        background: var(--lb-accent-soft);
      }
      .chapter-num {
        padding-top: 2px;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        color: var(--lb-text-secondary);
      }
      .chapter-copy {
        min-width: 0;
        flex: 1;
      }
      .chapter-copy strong {
        display: block;
        font-size: 12px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chapter-copy span {
        font-size: 10px;
        color: var(--lb-text-secondary);
        display: block;
        margin-top: 3px;
      }
      .chapter-item.active .chapter-copy strong {
        color: var(--lb-accent-ink);
      }
      .chapter-item .i {
        width: 12px;
        height: 12px;
        margin-top: 3px;
        color: var(--lb-success);
      }
      .outline-bottom {
        margin-top: auto;
        padding: 23px 8px 5px;
      }
      .outline-bottom label {
        display: block;
        color: var(--lb-text-secondary);
        font-size: 10px;
        margin-bottom: 7px;
      }
      .outline-bottom p {
        font-size: 11px;
        line-height: 1.9;
        color: var(--lb-text-secondary);
      }
      .document {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--lb-surface);
      }
      .editor-toolbar {
        height: 48px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 23px;
        color: var(--lb-text-secondary);
        font-size: 10px;
      }
      .editor-toolbar .tools {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .editor-toolbar .icon-btn {
        width: 28px;
        height: 28px;
      }
      .editor-toolbar .i {
        width: 15px;
        height: 15px;
      }
      .editor-scroller {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 20px 42px 32px;
      }
      .paper {
        max-width: 690px;
        margin: auto;
      }
      .chapter-title {
        font-family: var(--font-book);
        font-size: 30px;
        line-height: 1.4;
        font-weight: 650;
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        margin: 15px 0 10px;
        padding: 0;
      }
      .chapter-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 10px;
        color: var(--lb-text-secondary);
        margin-bottom: 30px;
      }
      .chapter-meta .i {
        width: 12px;
        height: 12px;
      }
      .prose {
        width: 100%;
        border: 0;
        background: transparent;
        resize: none;
        display: block;
        font-family: var(--font-book);
        font-size: 16px;
        line-height: 2.2;
        padding: 0;
        min-height: 220px;
        overflow: hidden;
        outline-offset: 10px !important;
      }
      .selection-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 12px;
        background: var(--lb-accent-soft);
        color: var(--lb-accent-ink);
        border: 1px solid var(--lb-line-soft);
        border-radius: 7px;
        margin-bottom: 20px;
        font-size: 11px;
      }
      .selection-bar .btn {
        min-height: 30px;
        padding: 4px 9px;
        background: var(--lb-surface);
        font-size: 11px;
      }
      .document-footer {
        height: 64px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 23px;
        border-top: 1px solid var(--lb-line-soft);
        background: var(--lb-surface);
        flex: none;
      }
      .word-info {
        font-size: 10px;
        color: var(--lb-text-secondary);
      }
      .word-info strong {
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .model-inline {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        padding: 0;
        color: var(--lb-text-secondary);
        font-size: 10px;
      }
      .model-inline .i {
        width: 11px;
        height: 11px;
      }
      .document-footer .btn {
        font-size: 11px;
      }
      .assistant {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        border-left: 1px solid var(--lb-line-soft);
        background: var(--lb-surface-muted);
      }
      .assistant-head {
        height: 53px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 19px;
        font-weight: 550;
        font-size: 12px;
      }
      .assistant-head > .i {
        width: 16px;
        height: 16px;
        color: var(--lb-accent);
      }
      .assistant-head > .icon-btn {
        margin-left: auto;
      }
      .context-row {
        margin: 0 17px 14px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 10px;
        border: 1px solid var(--lb-line-soft);
        border-radius: 6px;
        background: var(--lb-surface);
        font-size: 10px;
        color: var(--lb-text-secondary);
      }
      .context-row > .i {
        width: 13px;
        height: 13px;
        color: var(--lb-accent);
      }
      .context-row .truncate {
        flex: 1;
      }
      .assistant-messages {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 4px 20px 20px;
      }
      .assistant-intro {
        margin: 8px 0 16px;
      }
      .assistant-avatar {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 550;
        margin-bottom: 11px;
      }
      .assistant-avatar .brand-tile {
        width: 21px;
        height: 21px;
        font-size: 12px;
        border-radius: 5px;
      }
      .assistant-text {
        font-size: 12px;
        line-height: 1.9;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .assistant-text p + p {
        margin-top: 10px;
      }
      .context-tags {
        display: flex;
        gap: 5px;
        margin: 16px 0 20px;
        flex-wrap: wrap;
      }
      .context-tags .pill {
        background: var(--lb-surface);
      }
      .context-tags .i {
        width: 10px;
        height: 10px;
        color: var(--lb-success);
      }
      .suggestions {
        display: flex;
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }
      .suggestion {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-align: left;
        font-size: 11px;
        color: var(--lb-text-secondary);
        padding: 7px 10px;
        border: 1px solid var(--lb-line-soft);
        border-radius: 6px;
        background: var(--lb-surface);
      }
      .suggestion .i {
        width: 13px;
        height: 13px;
      }
      .user-bubble {
        background: var(--lb-surface-hover);
        border-radius: 8px;
        padding: 9px 11px;
        margin: 20px 0 18px 23px;
        font-size: 12px;
        line-height: 1.8;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .activity {
        font-size: 10px;
        color: var(--lb-text-secondary);
        display: flex;

        String(value ?? "").replace(

              '"': "&quot;",

      const bookText =
        "雾港的雨，总是在傍晚六点准时落下。\n\n林雾把最后一只纸箱推到柜台下面时，墙上的挂钟刚好走过六点。雨水沿着旧邮局的玻璃往下淌，将街对面的招牌揉成了一团模糊的红色。\n\n她回来已经三天了。\n\n三天，足够把母亲留下的衣服叠好，把院子里枯死的绣球剪掉，却不够让她习惯柜台后那张空着的藤椅。母亲过去总坐在那里，戴着一副细框眼镜，分拣那些越来越少的信件。\n\n门上的铜铃响了一声。\n\n林雾抬起头。门口没有人，只有一道刚刚收起的黑伞影子，从磨砂玻璃后面一闪而过。她绕过柜台，推开门。潮湿的风涌进来，带着海水和铁锈的气味。\n\n台阶上放着一封信。\n\n牛皮纸的信封，边角起了毛，像在某个抽屉里躺过很长时间。收件人是她，地址却是十二年前的地址——那时邮局还在桥的另一边，母亲也还没有开始忘记事情。\n\n林雾捏住信封的一角，把它翻了过来。\n\n背面没有寄件人的名字。只有一行小字，墨迹被雨水洇开了一点，但仍然看得清楚。\n\n「不要相信你记得的那个夏天。」\n\n她站在门口，忽然觉得这座熟悉的城市，比她离开的时候安静了许多。";
      function seed() {

                {
                  id: "c2",

                  summary:
                    "林雾在旧投递记录中找到一个被反复划去的名字，决定去找陈渡。",

                  summary:
                    "两人回到旧邮局的原址，发现潮水退去后露出的一段阶梯。",

                {
                  id: "c4",
                  title: "没有照片的夏天",

            {

                "一名失眠的插画师在末班车上遇见一位每晚都在同一站下车的老人。",
              style: "温柔、简洁，保持开放的结尾。",

                {
                  name: "许夏",
                  role: "主角 · 插画师",
                  bio: "夜晚比白天更清醒，常常带着一本画满陌生人的速写本。",

                  id: "t1",

                  summary: "从末班车上的一次相遇，展开关于告别的故事。",

            },

      let saved = null;

      function render() {

          project().id === "fog"

            : `${project().characters[0]?.name || "她"}停下手里的事，又看了一眼门口。声音已经消失了，留下的安静却比刚才更深。那个平常得不能再平常的细节，忽然有了另一种解释。`;

          {
            role: "assistant",
            text: `示例检查反馈：\n\n人物视角：当前按“${project().style}”作为检查依据。\n\n本章目标：${chapter().summary}\n\n建议核对：线索出现的时间是否与大纲一致；人物是否说出了当前阶段不应知道的信息。\n\n此原型展示检查结果的交互形式，未进行真实模型评审。`,
          },
        );
        state.proposal = null;
        renderAssistant();
      }
      function acceptProposal() {
        const p = state.proposal;
        if (!p) return;
        const c = project().chapters.find((x) => x.id === p.chapterId);
        if (!c) {
          toast("原章节已不存在，请重新发起改写。");
          return;
        }
        if (c.body.slice(p.start, p.start + p.original.length) !== p.original) {
          toast("原文已经修改，请基于最新内容重新生成建议。");
          return;
        }
        state.undo.push({ chapterId: c.id, body: c.body });
        c.body =
          c.body.slice(0, p.start) +
          p.replacement +
          c.body.slice(p.start + p.original.length);
        state.undo[state.undo.length - 1].after = c.body;
        state.messages.push({
          role: "assistant",
          text: "改写已采用。你仍可直接编辑正文，或使用编辑器上方的撤销按钮还原。",
        });
        state.proposal = null;
        state.selection = null;
        persist();
        render();
        toast("已采用改写，原文可撤销恢复");
      }
      function continueChapter() {
        if (state.busy) return;
        state.busy = true;
        const token = ++runToken,
          c = chapter(),
          p = project(),
          model = config().model,
          check = config().check;
        render();
        runTimer = setTimeout(() => {
          if (token !== runToken) return;
          state.undo.push({ chapterId: c.id, body: c.body });
          c.body +=
            (c.body ? "\n\n" : "") +
            (p.id === "fog"
              ? "她把信放到灯下。信封上没有邮戳，封口处却残留着一小片蓝色的蜡。那颜色让她想起母亲一直锁着的抽屉。\n\n林雾伸手去拉柜台最下面的抽屉。这一次，它没有锁。"
              : "走到门口时，她忽然停住了。那个一直被忽略的细节，此刻变得清晰起来。\n\n故事的下一步，就藏在那个尚未说出口的问题里。");
          state.undo[state.undo.length - 1].after = c.body;
          state.busy = false;
          state.messages.push({
            role: "assistant",
            text: `已添加一段演示续写。你可以直接编辑，或撤销恢复。${check ? "\n一致性检查已开启，可点击上方检查入口查看示例反馈。" : ""}\n本次选用：${model}（界面演示，未调用模型）。`,
          });
          persist();
          render();
          toast("演示续写已加入正文，可撤销");
        }, 1600);
      }
      function stopRun() {
        clearTimeout(runTimer);
        runToken++;
        state.busy = false;
        render();
        toast("已停止本地演示生成，正文保持原样");
      }
      function undo() {
        const index = state.undo.findLastIndex(
          (u) => u.chapterId === chapter().id,
        );
        if (index < 0) return;
        if (chapter().body !== state.undo[index].after) {
          toast("正文已有后续编辑，无法直接撤销之前的 AI 修改。");
          return;
        }
        chapter().body = state.undo[index].body;
        state.undo.splice(index, 1);
        state.proposal = null;
        state.selection = null;
        persist();
        render();
        toast("已撤销最近一次 AI 修改");
      }
      function sendChat(text = state.chatDraft) {
        text = text.trim();
        if (!text) return;
        state.chatMessages.push(
          { role: "user", text },
          {
            role: "assistant",
            text: "可以先把这个想法落在一个可观察的细节上：一件本来很熟悉的东西，今天发生了一点不合常理的变化。\n\n比如，一封写着旧地址的信，准确地出现在刚刚回乡的主角门口。读者会先问“谁送来的”，随后才意识到更重要的问题是“对方怎么知道她回来了”。\n\n你可以在创作项目中继续整理设定，再把这一点展开成章节。",
          },
        );
        state.chatDraft = "";
        render();
        $("#chat-scroll").scrollTop = $("#chat-scroll").scrollHeight;
      }
      function openProject(id) {
        if (state.busy) stopRun();
        state.projectId = id;
        state.chapterId = project().chapters[0].id;
        state.page = "workspace";
        state.tab = "write";
        state.selection = null;
        state.messages = [];
        state.proposal = null;
        state.assistantDraft = "";
        closeSidebars();
        render();
      }
      function openChapter(id) {
        if (state.busy) stopRun();
        state.chapterId = id;
        state.tab = "write";
        state.page = "workspace";
        state.messages = [];
        state.proposal = null;
        state.selection = null;
        state.assistantDraft = "";
        render();
      }
      function navigate(page) {
        state.page = page;
        closeSidebars();
        render();
      }
      function closeSidebars() {
        document.body.classList.remove("nav-open", "assistant-open");
      }
      function openDialog(content) {
        lastFocus = document.activeElement;
        $("#dialog").innerHTML = content;
        $("#dialog").showModal();
      }
      function closeDialog() {
        $("#dialog").close();
        if (lastFocus?.isConnected) lastFocus.focus();
      }
      function modelDialog() {
        openDialog(
          `<form id="model-form"><div class="dialog-head"><h2 id="dialog-title">创作设置</h2>${iconButton("close", "关闭设置", "close-dialog")}</div><div class="dialog-body"><p>为下一次创作选择模型。这里的选项用于预览配置方式。</p><label class="field">写作模型<select id="model-choice"><option ${config().model === "GPT-5" ? "selected" : ""}>GPT-5</option><option ${config().model === "Claude Sonnet 4" ? "selected" : ""}>Claude Sonnet 4</option><option ${config().model === "DeepSeek V3" ? "selected" : ""}>DeepSeek V3</option></select></label><label class="field" id="effort-field">思考强度<select id="effort-choice"><option value="minimal" ${config().effort === "minimal" ? "selected" : ""}>最小</option><option value="low" ${config().effort === "low" ? "selected" : ""}>低</option><option value="medium" ${config().effort === "medium" ? "selected" : ""}>中</option><option value="high" ${config().effort === "high" ? "selected" : ""}>高</option></select><small>参数控件仅作界面示意；实际可调项需由模型能力目录决定。</small></label><p id="direct-hint" hidden>该示例选项使用直接生成，不展示思考设置。</p><div class="setting-scope">${icon("info")}<span>影响${state.page === "chat" ? "下一条对话" : "当前项目的“撰写章节”步骤"}。已有正文不变，评审步骤保持固定模型。</span></div></div><div class="dialog-foot"><button class="btn" type="button" data-action="close-dialog">取消</button><button class="btn primary" type="submit">保存设置</button></div></form>`,
        );
        const sync = () => {
          const direct = $("#model-choice").value === "DeepSeek V3";
          $("#effort-field").hidden = direct;
          $("#direct-hint").hidden = !direct;
        };
        sync();
        $("#model-choice").addEventListener("change", sync);
        $("#model-form").addEventListener("submit", (e) => {
          e.preventDefault();
          config().model = $("#model-choice").value;
          config().effort = $("#effort-choice").value;
          persist();
          closeDialog();
          render();
          toast("设置已保存，将用于下一次演示生成");
        });
      }
      function newProjectDialog() {
        openDialog(
          `<form id="project-form"><div class="dialog-head"><h2 id="dialog-title">开始一个新故事</h2>${iconButton("close", "关闭新建项目", "close-dialog")}</div><div class="dialog-body"><p>从一个想法开始，其他细节可以慢慢补齐。</p><label class="field">项目名称<input name="name" required maxlength="40" placeholder="给你的故事起个名字" autofocus></label><label class="field">故事类型<select name="genre"><option>悬疑 · 长篇小说</option><option>都市 · 短篇小说</option><option>幻想 · 长篇小说</option><option>其他 · 小说</option></select></label><label class="field">最初的想法<textarea name="brief" required placeholder="谁，在什么地方，遇到了一件什么事？"></textarea></label><div class="note-inline">新项目仅保存在本地原型中。</div></div><div class="dialog-foot"><button type="button" class="btn" data-action="close-dialog">取消</button><button type="submit" class="btn primary">创建项目${icon("right")}</button></div></form>`,
        );
        $("#project-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const values = new FormData(e.target),
            name = String(values.get("name")).trim(),
            brief = String(values.get("brief")).trim();
          if (!name || !brief) {
            toast("请填写项目名称与最初的想法。");
            return;
          }
          const id = "p" + Date.now();
          data.projects.unshift({
            id,
            name,
            genre: String(values.get("genre")),
            brief,
            style: "第三人称，叙述清晰，以具体的场景和动作展开。",
            characters: [
              {
                name: "主角",
                role: "待完善",
                bio: "在这里写下主角的动机、经历与性格。",
              },
            ],
            chapters: [
              { id: id + "c1", title: "故事的开始", summary: brief, body: "" },
            ],
          });
          persist();
          closeDialog();
          openProject(id);
          state.tab = "setup";
          render();
          toast("项目已创建，可以完善设定");
        });
      }
      function addChapterDialog() {
        openDialog(
          `<form id="chapter-form"><div class="dialog-head"><h2 id="dialog-title">添加章节</h2>${iconButton("close", "关闭添加章节", "close-dialog")}</div><div class="dialog-body"><label class="field">章节标题<input name="title" required maxlength="60" placeholder="这一章叫什么？" autofocus></label><label class="field">本章目标<textarea name="summary" required placeholder="希望这一章发生什么？"></textarea></label></div><div class="dialog-foot"><button class="btn" type="button" data-action="close-dialog">取消</button><button class="btn primary" type="submit">添加章节</button></div></form>`,
        );
        $("#chapter-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const v = new FormData(e.target),
            title = String(v.get("title")).trim(),
            summary = String(v.get("summary")).trim();
          if (!title || !summary) {
            toast("请填写章节标题和目标。");
            return;
          }
          const id = "c" + Date.now();
          project().chapters.push({ id, title, summary, body: "" });
          persist();
          closeDialog();
          openChapter(id);
          toast("章节已添加");
        });
      }
      function exportText() {
        const p = project();
        const text =
          p.name +
          "\n\n" +
          p.chapters
            .map(
              (c, i) =>
                `第${i + 1}章 ${c.title}\n\n${c.body || "（尚未创作）"}`,
            )
            .join("\n\n────────\n\n");
        const url = URL.createObjectURL(
          new Blob([text], { type: "text/plain;charset=utf-8" }),
        );
        const a = document.createElement("a");
        a.href = url;
        a.download = p.name.replace(/[<>:"/\\|?*]/g, "_") + ".txt";
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast("已导出当前项目正文");
      }
      async function copyText() {
        try {
          await navigator.clipboard.writeText(chapter().body);
          toast("本章正文已复制");
        } catch {
          const prose = $("#prose");
          prose.focus();
          prose.select();
          captureSelection();
          toast("已选中正文，请按系统复制快捷键复制");
        }
      }
      const actions = {
        projects: () => navigate("projects"),
        chat: () => navigate("chat"),
        flow: () => navigate("flow"),
        settings: () => navigate("settings"),
        "back-write": () => {
          state.tab = "write";
          navigate("workspace");
        },
        "new-project": newProjectDialog,
        "add-chapter": addChapterDialog,
        model: modelDialog,
        "close-dialog": closeDialog,
        export: exportText,
        copy: copyText,
        undo,
        continue: continueChapter,
        stop: stopRun,
        "accept-proposal": acceptProposal,
        "discard-proposal": () => {
          state.proposal = null;
          renderAssistant();
          toast("已保留原文");
        },
        "rewrite-opening": () => makeProposal("让开场更有悬念", null),
        "rewrite-selection": () =>
          makeProposal("保留原意，把选中的这段写得更有悬念", state.selection),
        "check-consistency": () => checkConsistency(),
        assistant: () => {
          if (innerWidth <= 1190) {
            state.assistant = true;
            $(".workspace")?.classList.remove("assistant-hidden");
            document.body.classList.toggle("assistant-open");
          } else {
            state.assistant = !state.assistant;
            $(".workspace")?.classList.toggle(
              "assistant-hidden",
              !state.assistant,
            );
          }
        },
        "mobile-nav": () => {
          document.body.classList.remove("assistant-open");
          document.body.classList.toggle("nav-open");
        },
        collapse: () => {
          if (innerWidth <= 850) closeSidebars();
          else document.body.classList.toggle("sidebar-collapsed");
        },
        "new-chat": () => {
          state.chatMessages = [];
          state.chatDraft = "";
          navigate("chat");
        },
        "chat-seed": () => {
          state.page = "chat";
          state.chatMessages = [];
          sendChat("怎样让日常场景更有悬念？");
          closeSidebars();
        },
        "chat-tone": () => {
          state.page = "chat";
          state.chatMessages = [];
          sendChat("帮我寻找一个克制、细腻的叙述语气。");
          closeSidebars();
        },
        "clear-search": () => {
          state.search = "";
          render();
        },
        reset: () => {
          openDialog(
            `<div class="dialog-head"><h2 id="dialog-title">重置本地演示数据？</h2>${iconButton("close", "取消重置", "close-dialog")}</div><div class="dialog-body"><p>你在此原型中新增的项目和正文修改将被清除。需要保留的内容，请先导出。</p></div><div class="dialog-foot"><button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-reset">重置示例</button></div>`,
          );
        },
        "confirm-reset": () => {
          if (state.busy) stopRun();
          data = seed();
          state.projectId = data.projects[0].id;
          state.chapterId = data.projects[0].chapters[0].id;
          state.messages = [];
          state.proposal = null;
          state.undo = [];
          state.selection = null;
          persist();
          closeDialog();
          render();
          toast("已恢复初始示例");
        },
      };
      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        if (button.dataset.action) {
          event.preventDefault();
          actions[button.dataset.action]?.();
        } else if (button.dataset.project) openProject(button.dataset.project);
        else if (button.dataset.chapter) openChapter(button.dataset.chapter);
        else if (button.dataset.tab) {
          state.tab = button.dataset.tab;
          render();
        } else if (button.dataset.chatPrompt) {
          state.page = "chat";
          sendChat(button.dataset.chatPrompt);
        } else if (button.dataset.themeValue) {
          data.theme = button.dataset.themeValue;
          persist();
          render();
        }
      });
      $("#scrim").addEventListener("click", closeSidebars);
      $("#dialog").addEventListener("cancel", (event) => {
        event.preventDefault();
        closeDialog();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeSidebars();
      });
      window.addEventListener("resize", fitProse);
      window.addEventListener("pagehide", persist);
      render();
    </script>
  </body>
</html>
