# 项目名决定 Docker Desktop 中的容器组名，以及容器、镜像、数据卷的前缀。
name: bearxx-server-dev

x-application-build: &application-build
  context: ../..
  dockerfile: apps/api/Dockerfile
  target: development
  args:
    NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmjs.org/}
    # 留空用官方 binaries.prisma.sh；国内网络建议在 .env 里指向 npmmirror 镜像
    PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-}

# 渲染 Activity 需要 Chromium、中文字体与 ffmpeg，只有这个镜像带它们。
# 与 app 分开构建，避免把浏览器塞进处理 HTTP 的进程。
x-render-build: &render-build
  context: ../..
  dockerfile: apps/api/Dockerfile
  target: development-activity
  args:
    NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmjs.org/}
    PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-}

x-application-environment: &application-environment
  DATABASE_URL: postgresql://postgres:postgres@db:5432/litter_bear
  REDIS_HOST: redis
  REDIS_PORT: 6379
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: agent-flow-development
  TEMPORAL_TLS: 'false'

x-application-volumes: &application-volumes
  - ../../apps/api:/workspace/apps/api
  - ../../packages/types:/workspace/packages/types
  - api_node_modules:/workspace/apps/api/node_modules
  - types_node_modules:/workspace/packages/types/node_modules

# 渲染 Worker 的应用卷与上面完全一致，只多一个帧图磁盘卷。YAML 的序列不能像映射那样用
# `<<` 合并，因此这里重复列一次；改动应用卷时两处必须同步。
x-activity-volumes: &activity-volumes
  - ../../apps/api:/workspace/apps/api
  - ../../packages/types:/workspace/packages/types
  - api_node_modules:/workspace/apps/api/node_modules
  - types_node_modules:/workspace/packages/types/node_modules
  - render_frames:/var/tmp/html-render

# 注意根 /workspace/node_modules **不在**上面的列表里：它是镜像层，每个容器一份、
# 互不相通，而 Prisma Client 恰恰生成在那里的 .pnpm 存储中。
# apps/api/node_modules/@prisma/client 虽然在共享卷里，但只是软链，指回各容器
# 自己的镜像层——所以卷共享给不了 client 共享。
#
# 因此每个应用服务的 command 各自带一次 `db:generate`。少做这一步的后果是静默的：
# worker 会因为缺少新模型的类型而崩溃重启，前端只表现为接口 ERR_EMPTY_RESPONSE
# 或 Flow 任务不动，控制台里看不出跟数据库有关。
#
# 不把根 node_modules 也做成命名卷是刻意的：命名卷只在为空时从镜像填充，之后镜像
# 新增依赖会被旧卷遮住，得 down -v 才能恢复，比每次几百毫秒难查得多。
#
# generate 只读 schema.prisma 生成类型，不连数据库、不改数据，可无条件跑在启动前。
#
# 资源形态与生产一致：编排 Worker 与 Activity Worker 是独立进程，API 进程不内嵌任何
# Worker（TEMPORAL_EMBEDDED_WORKERS=false）。拆开的原因不只是资源：渲染 Activity 会启动
# Chromium 与 ffmpeg，一次成片要跑几十分钟，塞进 API 进程会直接把接口拖死；而编排 Worker
# 运行在 Temporal 的隔离沙箱里，本来就不该有数据库与浏览器能力。
# Temporal 的存储放在主 Postgres 的 temporal / temporal_visibility 库，Temporal UI 默认不
# 启动（需要时 `docker compose --profile debug up -d temporal-ui`）。mem_limit 按单机小规格
# 设定：app 额外给 tsc --watch 留余量，activity worker 额外给 Chromium 与 ffmpeg 留余量。

services:
  app:
    build: *application-build
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      <<: *application-environment
      TEMPORAL_EMBEDDED_WORKERS: 'false'
    # 开发态包含 nest --watch 的 tsc 增量编译；生产镜像只跑编译产物，占用明显更低
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      workspace-bootstrap:
        condition: service_completed_successfully
    volumes: *application-volumes
    working_dir: /workspace/apps/api
    command: sh -c 'pnpm run db:generate && pnpm run start:dev'

  worker-orchestrator:
    build: *application-build
    env_file:
      - .env
    environment:
      <<: *application-environment
      TEMPORAL_WORKER_ROLE: orchestrator
      TEMPORAL_EMBEDDED_WORKERS: 'false'
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      workspace-bootstrap:
        condition: service_completed_successfully
    volumes: *application-volumes
    working_dir: /workspace/apps/api
    command: sh -c 'pnpm run db:generate && pnpm run start:temporal-worker:orchestrator:dev'

  worker-activity:
    build: *render-build
    env_file:
      - .env
    environment:
      <<: *application-environment
      TEMPORAL_WORKER_ROLE: activity
      TEMPORAL_EMBEDDED_WORKERS: 'false'
      # 镜像里已装好 Chromium/ffmpeg；这里显式写出来，避免 .env 覆盖后指向不存在的路径
      HTML_RENDER_CHROME_PATH: /usr/bin/chromium
      # 帧图必须落在可写磁盘卷上，不能堆进镜像层，也不能放 tmpfs
      HTML_RENDER_TMP_ROOT: /var/tmp/html-render
      # 单次只跑一支渲染：并发渲染会同时抢 Chromium 内存与临时磁盘
      HTML_RENDER_MAX_CONCURRENCY: '1'
    # Chromium 的 setuid 沙箱需要创建 PID/network namespace；默认容器能力会拒绝它。
    # 只给独立渲染 Worker 此能力，仍以 node 运行并保留 Docker seccomp 与浏览器沙箱；
    # 不使用 privileged、seccomp=unconfined 或 --no-sandbox。生产运行同镜像也需此能力。
    cap_add:
      - SYS_ADMIN
    mem_limit: 4g
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      workspace-bootstrap:
        condition: service_completed_successfully
    # 帧图走磁盘卷而不是 tmpfs：tmpfs 的页算进 mem_limit，帧图会和 Chromium 抢同一份内存
    # 预算。成片要跑几十分钟、帧图按 GB 计，因此改用磁盘承接。
    # 渲染服务每次渲染一个独立目录并在 finally 里整目录删除，
    # 因此这里只需要一个可写卷承接运行中的帧。
    volumes: *activity-volumes
    working_dir: /workspace/apps/api
    command: sh -c 'pnpm run db:generate && pnpm run start:temporal-worker:activity:dev'

  workspace-bootstrap:
    build: *application-build
    env_file:
      - .env
    environment:
      <<: *application-environment
    depends_on:
      db:
        condition: service_healthy
    volumes: *application-volumes
    working_dir: /workspace
    command: >-
      sh -c 'pnpm --filter ./packages/types run build
      && pnpm --filter ./apps/api run db:migrate:deploy'
    restart: 'no'

  db:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: litter_bear
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    mem_limit: 128m
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.25.2
    mem_limit: 512m
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: db
      # auto-setup 首次启动在主 Postgres 内建这两个库，与业务库 litter_bear 互不干扰
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # Go 运行时软上限，低于 mem_limit 留出余量，避免内存涨到上限被 OOM kill
      GOMEMLIMIT: 400MiB
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '7233:7233'
    # auto-setup 只在容器对外 IP 上监听 7233，不绑 loopback：
    # localhost 会解析到 [::1]、127.0.0.1 也连不通，自检必须走服务名。
    healthcheck:
      test: ['CMD', 'tctl', '--address', 'temporal:7233', 'cluster', 'health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ['debug']
    mem_limit: 128m
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - '8233:8080'

volumes:
  api_node_modules:
  types_node_modules:
  pg_data:
  redis_data:
  render_frames:
