name: CI - Backend

on:
  push:
    branches: [main]
    paths:
      - 'Litter-Bear-Server/**'
  pull_request:
    branches: [main]
    paths:
      - 'Litter-Bear-Server/**'

defaults:
  run:
    working-directory: Litter-Bear-Server

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Litter-Bear-Server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test --passWithNoTests

      - name: Build
        run: pnpm build
